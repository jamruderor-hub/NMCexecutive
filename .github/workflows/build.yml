name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Mengambil Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet dan Modul Database
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merakit APK
        # Perintah sudah disesuaikan agar bersih dari error argumen lama
        run: yes | flet build apk

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: NMCexecutive-APK
          path: build/apk/**/*.apk
